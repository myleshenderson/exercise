name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

  # Applies pending SQL migrations to the linked Supabase project. Only on a
  # merge to main, and only after tests pass. No SUPABASE_DB_PASSWORD: CLI 2.x
  # provisions a temporary login role from the access token, so the PAT is the
  # only credential needed (see myleshenderson/dice-engine's ci.yml, verified
  # there on CLI 2.113.0). The project ref comes from SUPABASE_PROJECT_REF.
  #
  # This replaces Supabase's dashboard GitHub-branch integration, which was
  # decommissioned as part of exercise-4ly after being stuck in
  # MIGRATIONS_FAILED since the day after project creation with no automated
  # path ever having worked. See docs/supabase-migrations.md.
  migrate:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # The project ref comes from a repository secret rather than a tracked
      # file, so the public tree does not name the production project. Unlike
      # the access token below, a missing ref fails the job outright.
      - name: Require SUPABASE_PROJECT_REF
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error title=SUPABASE_PROJECT_REF missing::Repository secret SUPABASE_PROJECT_REF is not set. Add it (Settings > Secrets and variables > Actions) with the Supabase project ref so the migrate job can link the project."
            exit 1
          fi

      # Pinned: `latest` moved to CLI 3.x on 2026-11-09, where `db push` targets
      # the local stack unless told otherwise and `--linked` no longer exists,
      # which broke this job (AI-602). Bump deliberately, with the flags below.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      # Two migration files can end up with the same version prefix when two
      # PRs are authored independently (neither PR's own CI run ever sees the
      # other's file). `supabase db push` only records one applied migration
      # per version, so it would silently apply one and drop the other with
      # no failure or warning. Catch that here, before anything is pushed,
      # and on every run (not just when a migration changed in this diff) so
      # a collision between two separately-merged PRs is still caught the
      # first time CI runs on main afterward. See exercise-kch.
      - name: Check for colliding migration versions
        run: node scripts/check-migration-versions.mjs supabase/migrations

      # The `secrets` context cannot be read from a job-level `if`, so the
      # check happens here. Skipping loudly beats failing main for a repo
      # that has not had the secret added yet.
      - name: Apply pending migrations
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Migrations skipped::SUPABASE_ACCESS_TOKEN is not set, so no migration was applied."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote
